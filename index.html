<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tirol Trailhead</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MTB-Guiding || Consulting">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: 'Oswald', Arial, sans-serif;
      letter-spacing: 0.25em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg-video, .bg-image {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      width: 100vw;
      max-width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin: 0 0 0.5em 0;
      text-shadow: 0 2px 16px #000;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      margin: 2.5em auto 0 auto;
    }
    .btn {
      background: #222;
      color: #fff;
      border: none;
      border-radius: 0;
      padding: 1.2em 3em;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      box-shadow: 0 2px 16px #0008;
      text-transform: uppercase;
      outline: none;
      display: inline-block;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .btn:hover, .btn:focus {
      background: #fff;
      color: #111;
    }
    @media (orientation: landscape) and (min-width: 600px) {
      .btn-group {
        flex-direction: row;
        gap: 2.5rem;
        max-width: none;
        width: auto;
      }
      .btn {
        width: 220px;
        max-width: none;
      }
    }
    @media (max-width: 800px) {
      .bg-video { display: none; }
      .bg-image { display: block; }
    }
    @media (min-width: 801px) {
      .bg-video { display: block; }
      .bg-image { display: none; }
    }
    @media (max-width: 500px) {
      .btn {
        padding: 1em 0.5em;
        font-size: 1rem;
        max-width: 95vw;
      }
    }
    @media (max-width: 600px) {
      .content {
        max-width: 95vw;
        padding: 0 2vw;
      }
      h1 {
        font-size: 2rem;
        word-break: break-word;
        max-width: 100%;
        overflow-wrap: break-word;
      }
      .btn-group {
        width: 100%;
        max-width: 100vw;
      }
      .btn {
        box-sizing: border-box;
        width: 100%;
        max-width: 100vw;
        padding: 1em 0.5em;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="riverrun.mp4" type="video/mp4">
  </video>
  <img class="bg-image" src="lago_.jpg" alt="" />
  <div class="content">
    <h1>tiroltrailhead.com</h1>
    <div class="btn-group">
      <a class="btn" href="https://consulting.tiroltrailhead.com">Consulting</a>
      <a class="btn" href="https://guiding.tiroltrailhead.com">Guiding</a>
    </div>
  </div>
</body>
</html>
