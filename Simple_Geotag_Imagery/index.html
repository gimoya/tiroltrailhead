<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Geotag Imagery</title>
  
  <!-- External CSS -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Mapbox CSS -->
  <link rel="stylesheet" type="text/css" href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css">
</head>
<body>
  <div id="map"></div>
  
  <!-- User Feedback Messages -->
  <div id="feedback-messages" class="feedback-container"></div>
  
  <!-- Show Panel Button (appears when panel is hidden) -->
  <button id="show-panel" class="show-panel-btn" title="Show Panel">☰</button>
  
  <!-- Control Panel -->
  <div id="control-panel">
    <div class="panel-header">
      <h3>Simple Geotag Imagery</h3>
      <button id="hide-panel">✕</button>
    </div>
    
    <div class="panel-content">
      <!-- Search Location -->
      <div class="search-section">
        <h4>Search Location</h4>
        <div id="geocoder-container"></div>
      </div>
      
      <hr class="section-divider">
      
      <div class="mode-selector">
        <label>
          <input type="radio" name="mode" value="assign" checked> Assign Coordinates
        </label>
        <label>
          <input type="radio" name="mode" value="view"> View Media
        </label>
      </div>
      
      <div id="assign-mode" class="mode-content">
        <div class="file-input-container">
          <div class="file-input-section">
            <h4>Select Media Files</h4>
            <input type="file" id="media-files-input" multiple accept="image/*,video/*">
            <button id="select-files-btn" class="primary-btn">Choose Media Files</button>
            <div id="files-info" class="info-text"></div>
          </div>
          
          <div class="file-input-section">
            <h4>Load Walking Track (GPX)</h4>
            <input type="file" id="gpx-file-input" accept=".gpx">
            <button id="select-gpx-btn" class="primary-btn">Choose GPX File</button>
            <button id="clear-track-btn" class="secondary-btn">Clear Track</button>
            <div id="gpx-info" class="info-text"></div>
          </div>
        </div>
        
        <hr class="section-divider">
        
        <p>Click on the map to set coordinates for media files</p>
        <div id="file-list">
          <!-- File list will be populated here -->
        </div>
        <div id="coordinate-display">
          <p>Selected coordinates: <span id="selected-coords">None</span></p>
        </div>
      </div>
      
      <div id="view-mode" class="mode-content">
        <button id="show-media-btn" class="primary-btn">Show Media Pins</button>
        <button id="clear-media-btn" class="secondary-btn">Clear All Pins</button>
        <button id="download-all-btn" class="primary-btn download-btn">Download All Geotagged Photos</button>
        <div id="media-stats">
          <p>Files with coordinates: <span id="coord-count">0</span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Mapbox JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
  
  <!-- Mapbox Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">
  

  
  <!-- JSZip for bulk download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <!-- External JavaScript -->
  <script src="js/map.js"></script>
</body>
</html>
